<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>골프 팀 편성기</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas for image download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f0fdf4; /* Light green background */
        }
        .draggable {
            cursor: grab;
        }
        .draggable:active {
            cursor: grabbing;
        }
        .drag-over {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
            border-style: dashed !important;
        }
        /* Custom scrollbar for better look */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="text-slate-800 p-4 md:p-8 min-h-screen">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="text-center space-y-2">
            <h1 class="text-4xl font-bold text-green-800 flex items-center justify-center gap-2">
                <span>⛳</span> 골프 팀 편성기
            </h1>
            <p class="text-green-600">선수를 드래그 앤 드롭이나 선택 박스를 이용해 팀을 구성해보세요.</p>
        </header>

        <!-- Settings Section -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-green-100">
            <h2 class="text-lg font-bold mb-4 text-slate-700">⚙️ 팀 설정</h2>
            <div class="flex flex-wrap gap-4 items-end">
                <div class="flex-1 min-w-[120px]">
                    <label class="block text-sm font-medium text-slate-600 mb-1">총 팀 수</label>
                    <input type="number" id="num-teams" value="4" min="1" max="10" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-green-500 focus:ring-green-500 p-2 border">
                </div>
                <div class="flex-1 min-w-[120px]">
                    <label class="block text-sm font-medium text-slate-600 mb-1">팀별 최대 인원</label>
                    <input type="number" id="max-players" value="4" min="1" max="8" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-green-500 focus:ring-green-500 p-2 border">
                </div>
                <button onclick="applySettings()" class="bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-6 rounded-lg transition-colors w-full sm:w-auto">
                    적용
                </button>
            </div>
        </div>

        <!-- Action Bar -->
        <div class="flex justify-end gap-3">
            <button onclick="downloadImage()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition-colors flex items-center gap-2 shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
                이미지로 다운로드
            </button>
        </div>

        <!-- Capture Area (Team Board) -->
        <div id="capture-area" class="bg-white p-6 rounded-3xl shadow-md border border-slate-200 space-y-6 relative">
            
            <!-- Mobile Selection Guide Banner -->
            <div id="selection-banner" class="hidden absolute top-0 left-0 w-full bg-green-500 text-white text-center py-2 text-sm font-bold z-20 shadow-md rounded-t-3xl animate-pulse">
                👆 선수가 선택되었습니다. 배치할 팀의 빈 영역을 터치하세요.
            </div>

            <div class="text-center hidden" id="download-title">
                <h2 class="text-2xl font-bold text-green-800">⛳ 골프 팀 편성 결과</h2>
                <p class="text-sm text-gray-500 mt-1" id="download-date"></p>
            </div>

            <!-- Unassigned Pool -->
            <div class="bg-slate-50 rounded-2xl p-4 border border-slate-200">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-lg font-bold text-slate-700">대기 명단 (미배정)</h3>
                    <span id="unassigned-count" class="bg-slate-200 text-slate-700 text-xs font-bold px-2 py-1 rounded-full">0명</span>
                </div>
                <div id="unassigned" class="drop-zone flex flex-wrap gap-3 min-h-[80px] p-2 rounded-xl transition-colors cursor-pointer" onclick="handleZoneClick('unassigned')" ondrop="drop(event, 'unassigned')" ondragover="allowDrop(event)" ondragleave="dragLeave(event)">
                    <!-- Unassigned players will be injected here -->
                </div>
            </div>

            <!-- Teams Grid -->
            <div id="teams-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
                <!-- Teams will be dynamically injected here -->
            </div>
            
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // State - 16 Fixed Players
        let players = [
            { id: 'p1', name: '박호림', gender: 'M', handicap: null, teamId: 'unassigned' },
            { id: 'p2', name: '김홍훈', gender: 'M', handicap: null, teamId: 'unassigned' },
            { id: 'p3', name: '최현', gender: 'M', handicap: null, teamId: 'unassigned' },
            { id: 'p4', name: '김의석', gender: 'M', handicap: null, teamId: 'unassigned' },
            { id: 'p5', name: '천행태', gender: 'M', handicap: null, teamId: 'unassigned' },
            { id: 'p6', name: '고성대', gender: 'M', handicap: null, teamId: 'unassigned' },
            { id: 'p7', name: '김성진', gender: 'M', handicap: null, teamId: 'unassigned' },
            { id: 'p8', name: '고승현', gender: 'M', handicap: null, teamId: 'unassigned' },
            { id: 'p9', name: '김정민', gender: 'F', handicap: null, teamId: 'unassigned' },
            { id: 'p10', name: '김은정', gender: 'F', handicap: null, teamId: 'unassigned' },
            { id: 'p11', name: '정윤주', gender: 'F', handicap: null, teamId: 'unassigned' },
            { id: 'p12', name: '한지영', gender: 'F', handicap: null, teamId: 'unassigned' },
            { id: 'p13', name: '표서훈', gender: 'M', handicap: null, teamId: 'unassigned' },
            { id: 'p14', name: '윤장근', gender: 'M', handicap: null, teamId: 'unassigned' },
            { id: 'p15', name: '노대연', gender: 'M', handicap: null, teamId: 'unassigned' },
            { id: 'p16', name: '김지영', gender: 'F', handicap: null, teamId: 'unassigned' }
        ];
        let numTeams = 4;
        let maxPerTeam = 4;
        let draggedPlayerId = null;
        let activePlayerId = null; // 터치 이동을 위한 선택된 선수 ID

        // Initialize App
        function init() {
            renderTeamsGrid();
            renderPlayers();
        }

        // Settings applied
        function applySettings() {
            const newNumTeams = parseInt(document.getElementById('num-teams').value);
            const newMaxPerTeam = parseInt(document.getElementById('max-players').value);
            
            if (newNumTeams < 1 || newMaxPerTeam < 1) {
                alert("팀 수와 인원수는 1 이상이어야 합니다.");
                return;
            }

            // Move players back to unassigned if their team no longer exists
            players.forEach(p => {
                if (p.teamId !== 'unassigned' && parseInt(p.teamId.replace('team-', '')) > newNumTeams) {
                    p.teamId = 'unassigned';
                }
            });

            numTeams = newNumTeams;
            maxPerTeam = newMaxPerTeam;
            
            renderTeamsGrid();
            renderPlayers();
        }

        // Generate Team Containers dynamically based on settings
        function renderTeamsGrid() {
            const container = document.getElementById('teams-container');
            container.innerHTML = '';

            for (let i = 1; i <= numTeams; i++) {
                const teamId = `team-${i}`;
                
                const teamEl = document.createElement('div');
                teamEl.className = 'bg-white rounded-2xl p-4 border-2 border-slate-100 flex flex-col shadow-sm';
                
                teamEl.innerHTML = `
                    <div class="flex justify-between items-center border-b border-slate-100 pb-2 mb-3">
                        <h3 class="text-lg font-bold text-green-700">팀 ${i}</h3>
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-semibold text-slate-500 bg-slate-100 px-2 py-1 rounded-md" id="stats-hcp-${teamId}">평균 핸디: 0</span>
                            <span class="text-xs font-semibold px-2 py-1 rounded-full bg-green-100 text-green-700" id="stats-count-${teamId}">0 / ${maxPerTeam}명</span>
                        </div>
                    </div>
                    <div id="${teamId}" class="drop-zone flex-1 flex flex-col gap-2 min-h-[120px] p-2 rounded-xl transition-all border-2 border-transparent cursor-pointer" onclick="handleZoneClick('${teamId}')" ondrop="drop(event, '${teamId}')" ondragover="allowDrop(event)" ondragleave="dragLeave(event)">
                        <!-- Players go here -->
                    </div>
                `;
                container.appendChild(teamEl);
            }
        }

        // Render all players in their respective zones
        function renderPlayers() {
            // Clear all drop zones
            document.getElementById('unassigned').innerHTML = '';
            for (let i = 1; i <= numTeams; i++) {
                const teamZone = document.getElementById(`team-${i}`);
                if(teamZone) teamZone.innerHTML = '';
            }

            // Track stats
            let unassignedCount = 0;
            const teamStats = {};
            for (let i = 1; i <= numTeams; i++) {
                teamStats[`team-${i}`] = { count: 0, totalHandicap: 0, validHandicapCount: 0 };
            }

            // Create and append player elements
            players.forEach(player => {
                const isUnassigned = player.teamId === 'unassigned';
                const zone = document.getElementById(player.teamId);
                
                if (!zone) {
                    player.teamId = 'unassigned'; // fallback
                }

                // Update Stats
                if (player.teamId === 'unassigned') {
                    unassignedCount++;
                } else {
                    teamStats[player.teamId].count++;
                    if (player.handicap !== null) {
                        teamStats[player.teamId].totalHandicap += player.handicap;
                        teamStats[player.teamId].validHandicapCount++;
                    }
                }

                // Create Player Card
                const isActive = activePlayerId === player.id;
                const playerEl = document.createElement('div');
                playerEl.className = `draggable relative group flex items-center justify-between p-3 rounded-xl border shadow-sm transition-all cursor-pointer ${
                    player.gender === 'M' ? 'bg-blue-50 border-blue-200' : 'bg-pink-50 border-pink-200'
                } ${isActive ? 'ring-4 ring-green-400 scale-105 z-10 shadow-lg' : 'hover:-translate-y-0.5'}`;
                playerEl.draggable = true;
                playerEl.id = player.id;
                
                // Drag Events
                playerEl.addEventListener('dragstart', dragStart);
                playerEl.addEventListener('dragend', dragEnd);
                
                // Click Event for Tap-to-Move
                playerEl.onclick = (e) => handlePlayerClick(e, player.id);

                // Gender Badge & Name
                const genderIcon = player.gender === 'M' ? '<span class="text-blue-500 font-bold mr-1">M</span>' : '<span class="text-pink-500 font-bold mr-1">F</span>';
                const handicapText = player.handicap !== null ? `<span class="text-xs bg-white/60 px-2 py-0.5 rounded-full text-slate-600 border border-slate-200">Hcp: ${player.handicap}</span>` : '';

                // Build Mobile Dropdown Options
                let selectOptions = `<option value="unassigned" ${player.teamId === 'unassigned' ? 'selected' : ''}>대기 명단</option>`;
                for (let i = 1; i <= numTeams; i++) {
                    const tid = `team-${i}`;
                    selectOptions += `<option value="${tid}" ${player.teamId === tid ? 'selected' : ''}>팀 ${i}</option>`;
                }

                playerEl.innerHTML = `
                    <div class="flex items-center gap-2 flex-1 pointer-events-none">
                        <div class="flex-shrink-0 w-8 h-8 rounded-full bg-white flex items-center justify-center shadow-sm border ${player.gender === 'M' ? 'border-blue-100' : 'border-pink-100'}">
                            ${player.gender === 'M' ? '👨' : '👩'}
                        </div>
                        <div class="flex flex-col">
                            <span class="font-bold text-slate-700 text-sm">${player.name}</span>
                            ${handicapText}
                        </div>
                    </div>
                    
                    <!-- Mobile / Clickable Move Selector -->
                    <select onclick="event.stopPropagation()" onchange="changePlayerTeam('${player.id}', this.value)" class="text-sm md:text-xs border border-gray-300 rounded-md py-1.5 md:py-1 pr-7 pl-2 bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-green-500 appearance-none cursor-pointer shadow-sm relative z-20">
                        ${selectOptions}
                    </select>
                `;

                document.getElementById(player.teamId).appendChild(playerEl);
            });
            
            // Handle Selection Banner & Drop Zone Highlights
            const banner = document.getElementById('selection-banner');
            
            // Clear previous highlights
            document.querySelectorAll('.drop-zone').forEach(zone => {
                zone.classList.remove('bg-green-50', 'border-green-300', 'border-dashed');
            });

            if (activePlayerId) {
                if(banner) banner.classList.remove('hidden');
                // Highlight drop zones to guide the user
                document.querySelectorAll('.drop-zone').forEach(zone => {
                    zone.classList.add('bg-green-50', 'border-green-300', 'border-dashed');
                });
            } else {
                if(banner) banner.classList.add('hidden');
            }

            // Render Stats
            document.getElementById('unassigned-count').innerText = `${unassignedCount}명`;
            
            for (let i = 1; i <= numTeams; i++) {
                const tid = `team-${i}`;
                const stat = teamStats[tid];
                
                const countBadge = document.getElementById(`stats-count-${tid}`);
                if(countBadge) {
                    countBadge.innerText = `${stat.count} / ${maxPerTeam}명`;
                    if (stat.count > maxPerTeam) {
                        countBadge.className = "text-xs font-semibold px-2 py-1 rounded-full bg-red-100 text-red-700";
                    } else if (stat.count === maxPerTeam) {
                        countBadge.className = "text-xs font-semibold px-2 py-1 rounded-full bg-blue-100 text-blue-700";
                    } else {
                        countBadge.className = "text-xs font-semibold px-2 py-1 rounded-full bg-green-100 text-green-700";
                    }
                }

                const hcpBadge = document.getElementById(`stats-hcp-${tid}`);
                if(hcpBadge) {
                    if (stat.validHandicapCount > 0) {
                        const avg = (stat.totalHandicap / stat.validHandicapCount).toFixed(1);
                        hcpBadge.innerText = `평균 핸디: ${avg}`;
                    } else {
                        hcpBadge.innerText = `평균 핸디: -`;
                    }
                }
            }
        }

        // --- Drag and Drop Logic ---

        function dragStart(e) {
            draggedPlayerId = e.target.id;
            e.dataTransfer.setData('text/plain', e.target.id);
            // Slight visual change during drag
            setTimeout(() => e.target.classList.add('opacity-50'), 0);
        }

        function dragEnd(e) {
            e.target.classList.remove('opacity-50');
            // Remove hover styles from all zones
            document.querySelectorAll('.drop-zone').forEach(zone => {
                zone.classList.remove('drag-over');
            });
        }

        function allowDrop(e) {
            e.preventDefault(); // Allows drop
            
            // Highlight drop target
            const dropZone = e.target.closest('.drop-zone');
            if(dropZone) {
                dropZone.classList.add('drag-over');
            }
        }

        function dragLeave(e) {
            const dropZone = e.target.closest('.drop-zone');
            if(dropZone) {
                dropZone.classList.remove('drag-over');
            }
        }

        function drop(e, targetTeamId) {
            e.preventDefault();
            
            const dropZone = e.target.closest('.drop-zone');
            if(dropZone) {
                dropZone.classList.remove('drag-over');
            }

            const playerId = e.dataTransfer.getData('text/plain') || draggedPlayerId;
            if (!playerId) return;

            movePlayer(playerId, targetTeamId);
        }

        // --- Core Data Manipulation ---

        function movePlayer(playerId, targetTeamId) {
            const playerIndex = players.findIndex(p => p.id === playerId);
            if (playerIndex === -1) return;

            // Check max capacity for target team (ignore if moving to unassigned)
            if (targetTeamId !== 'unassigned') {
                const currentTeamCount = players.filter(p => p.teamId === targetTeamId).length;
                if (currentTeamCount >= maxPerTeam) {
                    alert('이 팀은 이미 꽉 찼습니다!');
                    return;
                }
            }

            players[playerIndex].teamId = targetTeamId;
            renderPlayers();
        }

        // For the Select box
        function changePlayerTeam(playerId, newTeamId) {
            movePlayer(playerId, newTeamId);
        }

        // --- Tap-to-Move Logic ---

        function handlePlayerClick(e, playerId) {
            // Prevent if they clicked the select dropdown directly
            if(e.target.tagName === 'SELECT') return; 
            e.stopPropagation();
            
            if (activePlayerId === playerId) {
                activePlayerId = null; // Deselect if clicked again
            } else {
                activePlayerId = playerId; // Select
            }
            renderPlayers();
        }

        function handleZoneClick(teamId) {
            if (activePlayerId) {
                movePlayer(activePlayerId, teamId);
                activePlayerId = null; // Clear selection after move
                renderPlayers(); // Re-render to clear highlights
            }
        }

        // --- Utility ---
        
        function downloadImage() {
            // 캡처 전에 선택 상태 초기화
            if (activePlayerId) {
                activePlayerId = null;
                renderPlayers();
            }

            const captureArea = document.getElementById('capture-area');
            const titleEl = document.getElementById('download-title');
            const dateEl = document.getElementById('download-date');
            
            // Format current date
            const now = new Date();
            dateEl.innerText = `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 생성됨`;

            // Prepare UI for capture (show title, hide scrollbars/extra UI if needed)
            titleEl.classList.remove('hidden');

            // Add a small delay to ensure rendering, then capture
            html2canvas(captureArea, {
                scale: 2, // High resolution
                backgroundColor: '#ffffff',
                logging: false,
                useCORS: true
            }).then(canvas => {
                // Restore UI
                titleEl.classList.add('hidden');

                // Create download link
                const link = document.createElement('a');
                link.download = `골프팀편성_${now.getFullYear()}${now.getMonth()+1}${now.getDate()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                console.error("Image capture failed", err);
                alert("이미지 저장에 실패했습니다.");
                titleEl.classList.add('hidden');
            });
        }

        // Boot
        window.onload = init;
    </script>
</body>
</html>
